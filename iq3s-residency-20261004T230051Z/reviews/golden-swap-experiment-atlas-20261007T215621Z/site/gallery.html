<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curated evidence | Golden Swap Experiment Atlas</title><link rel="stylesheet" href="/styles.css"><style>.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:20px;padding:20px}.gallery article{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.gallery img{width:100%;display:block;background:var(--input)}.gallery .caption{padding:16px}.gallery p{color:var(--muted)}.gallery a{display:inline-block;padding:8px 12px;background:var(--accent);color:var(--bg);border-radius:4px;text-decoration:none;font-weight:600}@media(max-width:550px){.gallery{grid-template-columns:1fr}}</style></head><body><header><div><span class="eyebrow">RaD / curated retrospective evidence</span><h1>Golden Swap: the views that explain the evidence</h1><p>Twelve selected views over retained journals. Open any card to zoom, hover, inspect exact generations and change filters.</p></div><a href="/?view=overview">Full interactive Atlas ↗</a></header><div id="gallery" class="gallery">Loading curated evidence…</div><script>
fetch('/review/results/curated-views.json').then(r=>{if(!r.ok)throw Error('Gallery manifest unavailable');return r.json();}).then(rows=>{const root=document.getElementById('gallery');root.replaceChildren();for(const row of rows){const card=document.createElement('article'),img=document.createElement('img'),box=document.createElement('div');img.src='/review/'+row.screenshot;img.alt=row.title;img.loading='lazy';box.className='caption';const title=document.createElement('h2'),p=document.createElement('p'),link=document.createElement('a');title.textContent=row.title;p.textContent=row.reason;link.href=row.path;link.textContent='Open interactive view';box.append(title,p,link);card.append(img,box);root.append(card);}}).catch(e=>document.getElementById('gallery').textContent=e.message);
</script></body></html>
