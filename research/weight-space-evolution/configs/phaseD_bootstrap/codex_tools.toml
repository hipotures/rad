# Based on the pinned upstream harness no-tools config. Generated session config adds only local lab MCP.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"
project_doc_max_bytes = 0

[agents]
enabled = false

[features]
code_mode = false
shell_tool = false
unified_exec = false
shell_snapshot = false
view_image = false
image_generation = false
multi_agent = false
apps = false
plugins = false
remote_plugin = false
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
in_app_browser = false
computer_use = false
code_mode_host = true
skill_search = false
skill_mcp_dependency_install = false
sleep_tool = false
tool_suggest = false
goals = false
hooks = false
worktrees = false
workspace_dependencies = false
